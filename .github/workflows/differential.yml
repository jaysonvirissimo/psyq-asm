name: Differential oracle

# Compares assembled words with an already-matched decompilation's original
# executable. The inputs are not public and must never pass through
# GitHub-hosted infrastructure, so the comparison runs only on a self-hosted
# runner (label: psyq-oracle) that already holds them on its own disk. Set the
# repository variables ORACLE_CHECKOUT_PATH, ORACLE_EXECUTABLE_PATH, and
# ORACLE_MANIFEST_PATH to paths on that runner. Without them the run ends with
# a notice. Only the name-free summary.json is uploaded; the detailed report
# stays in the runner's workspace under tmp/.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inputs:
    name: Check the oracle configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ORACLE_CHECKOUT_PATH: ${{ vars.ORACLE_CHECKOUT_PATH }}
          ORACLE_EXECUTABLE_PATH: ${{ vars.ORACLE_EXECUTABLE_PATH }}
          ORACLE_MANIFEST_PATH: ${{ vars.ORACLE_MANIFEST_PATH }}
        run: |
          if [ -z "$ORACLE_CHECKOUT_PATH" ] || [ -z "$ORACLE_EXECUTABLE_PATH" ] || [ -z "$ORACLE_MANIFEST_PATH" ]; then
            echo "::notice::Differential oracle skipped: ORACLE_CHECKOUT_PATH, ORACLE_EXECUTABLE_PATH, and ORACLE_MANIFEST_PATH are not all configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  oracle:
    name: Matched code against the original executable
    needs: inputs
    if: needs.inputs.outputs.configured == 'true'
    runs-on: [self-hosted, psyq-oracle]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - run: npm run test:differential
        env:
          PSYQ_ASM_ORACLE_CHECKOUT: ${{ vars.ORACLE_CHECKOUT_PATH }}
          PSYQ_ASM_ORACLE_EXECUTABLE: ${{ vars.ORACLE_EXECUTABLE_PATH }}
          PSYQ_ASM_ORACLE_MANIFEST: ${{ vars.ORACLE_MANIFEST_PATH }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: differential-summary
          path: test/differential/summary.json
          if-no-files-found: ignore
