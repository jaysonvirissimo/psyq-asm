name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # Fails fast when the tag, package.json, and CHANGELOG.md disagree.
      - run: node scripts/verify-release.mjs --tag "${GITHUB_REF_NAME}"

      - run: npm run build
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:package

      # Nothing is attached: the npm tarball is the artifact. The GitHub release
      # goes out first so a failure leaves nothing staged on npm, where a version
      # cannot be reused once withdrawn.
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      # Trusted publishing (OIDC): npm derives the credential from the job's
      # id-token, so there is no long-lived NPM_TOKEN in repository secrets. The
      # trusted publisher on npm allows staging only, so this job cannot make a
      # version public: a maintainer approves it with 2FA, under Staged Packages
      # on npmjs.com or with `npm stage approve <stage-id>`. Provenance is
      # attached exactly as for a direct publish.
      #
      # Staging needs npm 11.15.0 or newer. Upgraded here rather than before
      # `npm ci`, so the build and tests run on the same bundled npm as CI.
      - name: Upgrade npm for staged publishing
        run: |
          npm install -g npm@11
          npm --version
      - name: Stage the release on npm with provenance
        run: npm stage publish --provenance --access public
      - name: Ask for approval
        run: echo "::notice::${GITHUB_REF_NAME} is staged on npm. Approve it under Staged Packages on npmjs.com, or with npm stage list psyq-asm and npm stage approve <stage-id>."
